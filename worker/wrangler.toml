name = "fsrs-sync-auth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Google OAuth client ID, not a secret. Fill in before deploying.
GOOGLE_CLIENT_ID = "xxxx.apps.googleusercontent.com"
# Origins allowed to call this Worker, comma separated
ALLOWED_ORIGINS = "https://username.github.io"
# Web Push (daily reminders): contact address and public key from scripts/gen-vapid.mjs
VAPID_SUBJECT = "mailto:you@example.com"
VAPID_PUBLIC_KEY = ""

# The client secret is NOT stored here. Set it with:  npx wrangler secret put GOOGLE_CLIENT_SECRET

# --- Daily reminders (Web Push) ---
# Subscriptions and reminder times are kept in this KV namespace. Create it with:
#   npx wrangler kv namespace create fsrs-push      and paste the printed id below
[[kv_namespaces]]
binding = "PUSH"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Checks every 5 minutes for reminders that are due
[triggers]
crons = ["*/5 * * * *"]

# VAPID_SUBJECT and VAPID_PUBLIC_KEY are under [vars] above (run scripts/gen-vapid.mjs for the key);
# the private key is a secret:  npx wrangler secret put VAPID_PRIVATE_JWK
