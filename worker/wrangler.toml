# 這是會被 commit 的範例，只放佔位字，不要填入真實的值。
# 真實的值放在 wrangler.local.toml（已被 git 忽略，執行 npm run deploy 或
# node scripts/gen-vapid.mjs 時會自動建立，範例有新增設定時也會自動補進去）。
# 部署：npm run deploy

name = "fsrs-sync-auth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Google OAuth 用戶端 ID（不是密鑰），部署前填入
GOOGLE_CLIENT_ID = "xxxx.apps.googleusercontent.com"

# 允許呼叫這個 Worker 的網站，多個用逗號分隔
ALLOWED_ORIGINS = "https://username.github.io"

# 每日提醒（Web Push）的聯絡資訊，推播服務有狀況時用來聯絡你。
# 不會真的寄信，也不會驗證信箱是否存在，但格式要正確：
# mailto:你的信箱，或 https://你的網站網址 都可以，不要留空。
VAPID_SUBJECT = "mailto:you@example.com"

# 每日提醒的金鑰，由 scripts/gen-vapid.mjs 自動寫進 wrangler.local.toml。
# 私鑰絕對不要寫在這個檔案裡；部署時會自動改存成 Cloudflare 的加密密鑰。
VAPID_PUBLIC_KEY = ""
VAPID_PRIVATE_JWK = ""

# Google 用戶端密鑰不存在這裡，用這個指令設定：npx wrangler secret put GOOGLE_CLIENT_SECRET

# --- 每日提醒（Web Push）---
# 推播訂閱與提醒時間存在這個 KV。用這個指令建立，再把印出的 id 貼到下面：
# npx wrangler kv namespace create fsrs-push
[[kv_namespaces]]
binding = "PUSH"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 每 5 分鐘檢查一次有沒有到時間的提醒
[triggers]
crons = ["*/5 * * * *"]
